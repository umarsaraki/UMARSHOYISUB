name = "umarshoyisub"
main = "worker.js"
compatibility_date = "2025-11-01"

# Keep variables/secrets you add in the Cloudflare dashboard when GitHub redeploys.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "umarshoyi-db"
database_id = "2b79c9f4-2682-4e95-85bc-0a7e92d8fd19"

[triggers]
# Every 5 minutes: settle purchases that are still "pending" at VTUAgent
crons = ["*/5 * * * *"]

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Plain (NOT secret) settings. It is safe to keep these here: they stay after every deploy.
# NEVER write secret keys in this file: your GitHub repo can be read by others.
# Secrets (add in Cloudflare -> Variables and Secrets, type "Secret"):
#   AUTH_SECRET, FLW_SECRET_KEY, FLW_WEBHOOK_HASH, VTUAGENT_API_KEY
# ---------------------------------------------------------------------------
[vars]
APP_NAME = "UMARSHOYI-SUB"
ADMIN_EMAILS = "umarsaraki96@gmail.com"
ATC_BANK_FEE = "0"
PRICE_MARKUP_PERCENT = "12"

# ---- Exchange (send money to Nigeria). OFF until you set EXCHANGE_ENABLED = "1" ----
# Turn it on only after Flutterwave has upgraded your account for this.
EXCHANGE_ENABLED = "0"
EXCHANGE_FEE_PERCENT = "10"
EXCHANGE_MIN_AMOUNT = "5"
EXCHANGE_MAX_AMOUNT = "100"
EXCHANGE_DAILY_COUNT = "3"
# ---- Bulk SMS: set your own price per SMS page (naira) to open the feature ----
# SMS_PRICE_PER_UNIT = "5"
