name = "umarshoyisub"
main = "worker.js"
compatibility_date = "2025-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "umarshoyi-db"
database_id = "2b79c9f4-2682-4e95-85bc-0a7e92d8fd19"

[observability]
enabled = true

[vars]
APP_NAME = "UMARSHOYI-SUB"
# Put your own admin email(s) here, comma separated. They become admin when they register/login.
ADMIN_EMAILS = ""
# Optional fee (naira) charged on Airtime-to-Cash bank withdrawals
ATC_BANK_FEE = "0"
# "1" = pretend purchases succeed, so you can test every screen. Keep "0" for real customers!
TEST_MODE = "0"
