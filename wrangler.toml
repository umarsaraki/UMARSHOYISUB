name = "umarshoyi-sub"
main = "worker.js"
compatibility_date = "2026-11-08"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "umarshoyi-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
APP_NAME = "UMARSHOYI-SUB"
